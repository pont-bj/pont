name: Bug
description: Signaler un comportement incorrect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Pour une faille de sécurité, n'ouvre pas d'issue : lis SECURITY.md.
        Ne colle jamais de clé, de jeton ni de donnée réelle.
  - type: input
    id: version
    attributes:
      label: Version ou commit
    validations:
      required: true
  - type: dropdown
    id: composant
    attributes:
      label: Composant
      options: [core, adaptateur, sandbox, serveur, registre/portefeuille, stockage, SDK, CLI, dashboard, déploiement self-host, documentation, autre]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: observe
    attributes:
      label: Comportement observé (logs sans secret)
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement (OS, Node, base de données)
