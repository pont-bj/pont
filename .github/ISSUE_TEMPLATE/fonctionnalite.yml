name: Fonctionnalité
description: Proposer une amélioration ou un nouvel adaptateur
labels: ["enhancement"]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Problème à résoudre
      description: Quel besoin ou quelle difficulté ?
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Proposition
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
  - type: checkboxes
    id: engagement
    attributes:
      label: Engagement
      options:
        - label: Je suis prêt(e) à contribuer cette fonctionnalité (et à accepter le CLA).
        - label: J'ai vérifié qu'aucune issue similaire n'existe.
